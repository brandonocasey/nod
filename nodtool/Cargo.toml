[package]
name = "nodtool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/nodtool"
readme = "../README.md"
description = """
CLI tool for extracting and converting GameCube and Wii disc images.
"""
keywords.workspace = true
categories = ["command-line-utilities", "parser-implementations"]
build = "build.rs"

[features]
default = [
    "extract-bzip2",
    "compress-bzip2",
    "extract-lzma",
    "compress-lzma",
    "extract-zlib",
    "compress-zlib",
    "extract-zstd",
    "compress-zstd",
    "threading",
]
extract-bzip2 = ["nod/extract-bzip2-static"]
compress-bzip2 = ["nod/compress-bzip2-static"]
extract-lzma = ["nod/extract-lzma-static"]
compress-lzma = ["nod/compress-lzma-static"]
extract-zlib = ["nod/extract-zlib-static"]
compress-zlib = ["nod/compress-zlib-static"]
extract-zstd = ["nod/extract-zstd-static"]
compress-zstd = ["nod/compress-zstd-static"]
openssl = ["nod/openssl"]
openssl-vendored = ["nod/openssl-vendored"]
tracy = ["dep:tracing-tracy"]
threading = ["nod/threading", "dep:num_cpus"]

[dependencies]
argp = "0.4"
crc32fast = "1.5"
digest = { workspace = true }
enable-ansi-support = "0.3"
hex = { version = "0.4", features = ["serde"] }
indicatif = "0.18"
md-5 = { workspace = true }
nod = { version = "2.0.0-alpha", path = "../nod", default-features = false }
num_cpus = { version = "1.17", optional = true }
quick-xml = { version = "0.39", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
sha1 = { workspace = true }
size = "0.5"
supports-color = "3.0"
tracing = { workspace = true }
tracing-attributes = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-tracy = { version = "0.11", features = ["flush-on-exit"], optional = true }
zerocopy = { workspace = true }
zstd = "0.13"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"

[build-dependencies]
hex = { version = "0.4", features = ["serde"] }
quick-xml = { version = "0.38", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
zerocopy = { version = "0.8", features = ["alloc", "derive"] }
zstd = "0.13"
